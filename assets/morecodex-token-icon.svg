<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">MoreCodex token overflow icon</title>
<desc id="desc">Electric-lime code tokens spilling from a dark terminal container.</desc>
<defs>
